<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D-CLIC Congo, préinscription cohorte 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"></noscript>
<style>
:root{--bg:#0A2221;--surface:#123533;--text:#F1F7F4;--muted:#A9C2BD;--line:#2A5551;--btn:#FFD612;--btnfg:#123C3B;color-scheme:dark;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:96px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--text);font:400 16px/1.6 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-weight:700;font-size:clamp(34px,7vw,60px);line-height:1.1;letter-spacing:-.02em;margin:.35em 0 .45em;max-width:13ch}
h2{font-weight:700;font-size:clamp(22px,5vw,30px);line-height:1.2;margin:.4em 0 .5em}
h2.h2l{font-size:clamp(28px,6vw,48px)}
p{margin:0 0 1em;max-width:62ch}
.muted{color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #29ABE2;outline-offset:2px}

/* en-tête fixe : logo DGFQE à gauche, logo D-CLIC à droite */
main,.note,.sub{position:relative;z-index:2}
header{position:sticky;top:0;z-index:30;background:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 16px rgba(0,0,0,.35)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:8px;padding-bottom:8px}
header img{height:52px;width:auto;display:block}
.flag{height:5px;background:linear-gradient(90deg,#009A44 33.3%,#FBDE4A 33.3% 66.6%,#DC241F 66.6%)}
.sub{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:0}
.step{margin:0;font-size:13px;color:var(--muted)}
.sndb{font:400 12px Poppins,system-ui,sans-serif;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.sndb:hover{color:var(--text)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding:16px 0 28px;margin-top:36px}
.note p{max-width:none;margin:0 0 .4em}
.ctc{margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.ctc h2{font-size:18px;margin:0 0 10px;color:var(--text)}
.ctc p{font-size:14px;margin:0 0 .35em;color:var(--text)}
.ctc b{display:inline-block;min-width:92px;color:var(--muted);font-weight:400}

/* fond animé */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#world::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--w,#29ABE2) 48%,transparent),transparent 62%)}
#world i{position:absolute;width:11px;border-radius:6px;animation:fl ease-in-out infinite alternate;translate:calc(var(--px,0)*-90px*var(--d,.5)) calc(var(--py,0)*-90px*var(--d,.5))}
@keyframes fl{to{transform:translateY(-70px)}}
#spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(460px circle at var(--mx,50%) var(--my,40%),color-mix(in srgb,var(--w,#29ABE2) 24%,transparent),transparent 70%);transition:opacity .6s}
body.cine #spot{opacity:.25}
body.cine #world i{opacity:.05!important;animation-play-state:paused;transition:opacity .8s}
#world.pw::before{animation:pw .8s ease-out}
@keyframes pw{35%{transform:scale(1.35);filter:brightness(1.6)}}
#wipe{position:fixed;inset:0;z-index:50;background:var(--wc,#123C3B);pointer-events:none;clip-path:circle(0% at 50% 62%)}

/* boutons et champs */
.btn{font:600 16px Poppins,system-ui,sans-serif;background:var(--btn);color:var(--btnfg);border:0;border-radius:14px;padding:14px 24px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
input,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
input:focus,textarea:focus{border-color:var(--c)}
input[type=date]{color-scheme:dark}
.err{color:#FF8A98;font-size:14px;margin:6px 0 0}
.lk{all:unset;cursor:pointer;color:#FFD612;font-size:inherit;text-decoration:underline}
.lk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pulse{animation:pls 1.3s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.06)}}
.ent{opacity:0;animation:entIn .65s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--ed,0s)}
@keyframes entIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* accueil : texte à gauche, déroulement à droite */
.hero.two{display:grid;gap:32px;align-items:center}
@media (min-width:900px){.hero.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px}}
.how{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);border-radius:24px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.how .lab{margin:0 0 18px}
.how ol{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.how li{display:flex;gap:16px;align-items:flex-start}
.how li i{flex:none;width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;font:700 18px Poppins,system-ui,sans-serif;font-style:normal;display:grid;place-items:center}
.how b{display:block;font-size:17px;line-height:1.3}
.how span{color:var(--muted);font-size:14px;line-height:1.45}
.how .fin{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);max-width:none}

/* icônes */
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* accueil et choix */
.hero{min-height:56vh;display:flex;flex-direction:column;justify-content:center;padding-top:10px}
.pk{display:grid;gap:16px;margin:26px 0;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:10px;padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--text);position:relative;overflow:hidden;transition:translate .25s,box-shadow .25s,border-color .25s}
.pc::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.pc b{font-size:22px;line-height:1.2}
.pc .tg2{color:var(--muted)}
.pc em{font-style:normal;font-weight:600;font-size:20px;margin-top:2px}
.pc:hover{translate:0 -5px;border-color:var(--c);box-shadow:0 12px 40px color-mix(in srgb,var(--c) 40%,transparent)}
.pc:focus-visible{outline:3px solid #fff;outline-offset:4px}

/* découverte */
.dw{display:grid;gap:28px;align-items:center;padding:14px 0 30px}
@media (min-width:820px){.dw{grid-template-columns:auto 1fr;gap:56px}}
.phone{position:relative;width:min(300px,76vw,calc(68vh*9/16));width:min(300px,76vw,calc(68dvh*9/16));aspect-ratio:9/16;border-radius:30px;overflow:hidden;margin:0 auto;background:#F7FAF8;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 65%,#fff),0 0 90px color-mix(in srgb,var(--c) 70%,transparent);transition:box-shadow .6s}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.big{all:unset;position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:rgba(10,34,33,.4);color:#fff;font-size:46px}
.big:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.ld{display:none;position:absolute;inset:0;pointer-events:none;background:rgba(10,34,33,.45)}
.ld::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.cine .phone{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 65%,#fff),0 0 140px color-mix(in srgb,var(--c) 85%,transparent)}}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--line);color:var(--text);font:400 14px Poppins,system-ui,sans-serif;transition:background .25s,border-color .25s}
.seg .ic{width:30px;height:30px;border-radius:50%}
.seg .ic svg{width:16px;height:16px}
.seg button:hover{border-color:var(--c)}
.seg button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.seg button[aria-selected="true"] .ic{background:#ffffff33}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.lead{font-size:clamp(20px,4vw,28px);font-weight:600;line-height:1.3;margin:0 0 .6em;max-width:28ch}
.lab{font:400 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.jl{border-bottom:1px solid var(--line);margin-bottom:16px}
.job{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding:16px 6px;transition:padding .3s,background .3s}
.job i{flex:none;width:26px;font:400 13px ui-monospace,Menlo,Consolas,monospace;font-style:normal;color:color-mix(in srgb,var(--c) 55%,#fff)}
.job>div{flex:1}
.job b{display:block;font-size:17px;margin-bottom:3px}
.job span{color:var(--muted);font-size:14px;line-height:1.45}
.job:hover{padding-left:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 85%)}
@media (max-width:600px){.side .row .btn{flex:1 1 100%}}

/* fenêtres (formulaire et informations légales) */
.md{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(4,16,15,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:mdIn .25s ease-out}
.md.lg{z-index:90}
@keyframes mdIn{from{opacity:0}}
.mdc{position:relative;display:flex;flex-direction:column;width:min(600px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden;animation:mcIn .4s cubic-bezier(.22,1,.36,1)}
.lg .mdc{width:min(720px,100%)}
@keyframes mcIn{from{opacity:0;transform:translateY(28px) scale(.97)}}
.mh{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;border-bottom:1px solid var(--line)}
.mh .ic{width:40px;height:40px;border-radius:12px}
.mt{flex:1;min-width:0;line-height:1.25}
.mt small{display:block;color:var(--muted);font-size:12px}
.mt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.mx:hover{background:var(--line);color:var(--text)}
.mx:focus-visible{outline:3px solid #fff}
.mbd{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 22px 22px;animation:qin .45s cubic-bezier(.22,1,.36,1)}
.mbd.still{animation:none}
@keyframes qin{from{opacity:0;transform:translateX(26px)}}
.pb{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:18px}
.pb div{height:100%;background:var(--c);border-radius:3px;transition:width .5s}
.mk{margin:0 0 6px;font:400 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mq{font-size:clamp(20px,4.6vw,26px);line-height:1.3;margin:0 0 18px;font-weight:600}
.mq.sm{font-size:17px;font-weight:600;line-height:1.5}
.mq:focus{outline:none}
.qn{font-size:14px;color:var(--muted);margin:-6px 0 16px}
.qi{border-left:4px solid var(--c,#29ABE2);background:color-mix(in srgb,var(--c,#29ABE2) 14%,transparent);padding:10px 14px;border-radius:10px;font-size:14px;margin:14px 0 0}
.mos{display:grid;gap:10px}
.mo{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);color:var(--text);font:400 16px/1.35 Poppins,system-ui,sans-serif;transition:border-color .2s,background .2s}
.mo i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);position:relative;transition:border-color .2s}
.mo:hover{border-color:var(--c)}
.mo.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.mo.sel i{border-color:var(--c)}
.mo.sel i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--c)}
.mo:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mbd input,.mbd textarea{font-size:16px;padding:15px 16px;border-radius:14px}
.mbd .ok{margin:6px 0 16px}
.ok{width:72px;height:72px;border-radius:50%;background:#5E9120;display:grid;place-items:center;color:#fff;font-size:38px;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.mf .btn{flex:0 1 auto}
.mf .btn.pri{background:var(--c);color:#fff}
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0}
.rv dt{color:var(--muted)}
.rv dd{margin:0;font-weight:600;overflow-wrap:anywhere;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rv .lk{font-size:13px;font-weight:400;white-space:nowrap}
.cert{display:flex;gap:10px;align-items:center;margin:16px 0}
.cert input{width:20px;height:20px;flex:none;padding:0}
.lgt{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px 0}
.lgt button{font:600 14px Poppins,system-ui,sans-serif;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 16px;cursor:pointer}
.lgt button[aria-selected="true"]{background:var(--btn);border-color:var(--btn);color:var(--btnfg)}
.lgb h3{font-size:16px;margin:20px 0 6px}
.lgb h3:first-child{margin-top:4px}
.lgb p{margin:0 0 .8em;max-width:none;font-size:15px}
mark.todo{background:#FFD612;color:#123C3B;padding:0 5px;border-radius:4px;font-weight:600}
@media (max-width:600px){.md{padding:0}.mdc{width:100%!important;height:100vh;height:100dvh;max-height:none;border-radius:0;border:0}.mbd{padding:16px 18px 20px}.mf{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}.mf .btn{flex:1 1 auto;padding:14px 16px}.lgt{padding:12px 18px 0}.rv{grid-template-columns:1fr;gap:2px}.rv dt{font-size:12px;margin-top:10px}.rv dt:first-child{margin-top:0}}
@media (max-width:600px){header img{height:42px}html{scroll-padding-top:80px}}
@media (max-height:520px) and (orientation:landscape){.hero{min-height:0}.phone{width:min(220px,40vw)}}

/* effets : uniquement avec une souris, jamais en mouvement réduit */
@media (hover:hover) and (pointer:fine){.phone{transform:perspective(900px) rotateY(calc(var(--px,0)*14deg)) rotateX(calc(var(--py,0)*-10deg))}}

/* particules et confettis */
.pt{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:70;animation:pt .7s ease-out forwards}
@keyframes pt{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.cf{position:fixed;top:-16px;width:9px;height:15px;border-radius:2px;z-index:120;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ent{opacity:1!important}.phone{transform:none!important}}
</style>
</head>

/* envoi et file d’attente hors ligne */
const PK="dclic_pending",SENT={};
const pend=()=>{try{return JSON.parse(localStorage.getItem(PK)||"[]")}catch(e){return[]}};
const setPend=a=>{try{localStorage.setItem(PK,JSON.stringify(a))}catch(e){}};
async function post(d){const r=await fetch(CFG.URL,{method:"POST",body:new URLSearchParams(d)});const j=await r.json();if(!j.ok){const e=new Error(j.error||"Erreur");e.code=j.error;e.champ=j.champ;throw e}return j.ref}
const definitif=e=>!!e&&(e.code==="invalid"||e.code==="closed");   /* inutile de renvoyer : le serveur refusera encore */
async function flush(){if(!CFG.URL||!navigator.onLine)return;for(const d of pend()){try{SENT[d.id]=await post(d);setPend(pend().filter(x=>x.id!==d.id))}catch(e){if(definitif(e))setPend(pend().filter(x=>x.id!==d.id))}}}
addEventListener("online",flush);flush();

/* validation */
function ageOf(d){const n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function check(q,v){
 let e="",val=v;
 if(q.type==="text"){val=v=v.replace(/\s+/g," ");if(!/\p{L}{2}/u.test(v))e="Saisissez au moins deux lettres."}
 if(q.type==="tel"){
  const d=v.replace(/[\s.\-()]/g,"").replace(/^(\+|00)?242/,"");
  const okM=/^0[1456]\d{7}$/.test(d),okF=/^22\d{7}$/.test(d);
  if(!(okM||(q.land&&okF)))e=q.land?"Saisissez un numéro à 9 chiffres : mobile (01, 04, 05 ou 06) ou fixe (22), par exemple 06 123 45 67.":"Saisissez un numéro mobile à 9 chiffres commençant par 01, 04, 05 ou 06, par exemple 06 123 45 67.";
  else{val=d.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/,"$1 $2 $3 $4");
   if(q.id==="tel2"&&val===S.ans.tel)e="Ce numéro est identique à votre numéro principal.";
   if(q.id==="proche_tel"&&val===S.ans.tel)e="Le numéro de votre proche doit être différent du vôtre."}}
 if(q.type==="email"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))e="Saisissez une adresse email valide, par exemple nom@exemple.com.";val=v.toLowerCase()}
 if(q.type==="date"){
  const d=new Date(v+"T12:00:00");
  if(!v||isNaN(d)||d>new Date())e="Choisissez une date de naissance valide.";
  else{const a=ageOf(d);
   if(a<CFG.AGE_MIN)e="Cette date semble trop récente : vérifiez votre date de naissance.";
   else if(a>CFG.AGE_MAX)e="Cette date semble trop ancienne : vérifiez votre date de naissance."}}
 if(q.type==="long"&&v.length<15)e="Rédigez au moins une ou deux phrases.";
 return{e,val};
}

  const q=S.qs[S.i],ap=applicable(),pos=ap.indexOf(S.i),cur0=S.ans[q.id],has=cur0!==undefined&&cur0!=="—",cur=has?cur0:"";
  const info=q.notes&&has&&q.notes[cur0]?`<p class="qi" role="status">${q.notes[cur0]}</p>`:"";
  let inp;
  if(q.o)inp=`<div class="mos">${q.o.map((o,ix)=>`<button type="button" class="mo${S.ans[q.id]===o?" sel":""}" onclick="pickOpt(${ix})"><i></i><span>${o}</span></button>`).join("")}</div>`;
  else inp=q.type==="long"?`<textarea id="in" rows="5" maxlength="1500" placeholder="${q.ph||""}">${esc(cur)}</textarea>`:`<input id="in" type="${q.type}" value="${esc(cur)}" maxlength="${q.type==="email"?254:80}" ${q.ph?`placeholder="${q.ph}"`:""} ${q.type==="date"?`min="1900-01-01" max="${new Date().toISOString().slice(0,10)}"`:""} ${q.type==="tel"?'inputmode="tel"':""} autocomplete="off">`;
  body=`<div class="pb"><div style="width:${Math.round((pos+1)/ap.length*100)}%"></div></div><p class="mk">Question ${pos+1} sur ${ap.length} · ${SEC[q.sec]}</p><h2 class="mq${q.t.length>90?" sm":""}" id="mq" tabindex="-1">${q.t}</h2>${q.note?`<p class="qn">${q.note}</p>`:""}${inp}${info}${err}`;
  foot=`<button type="button" class="btn ghost" onclick="prevQ()">${S.editing||pos<=0?"Annuler":"Retour"}</button>${q.skip?`<button type="button" class="btn ghost" onclick="answer('—')">${q.skip}</button>`:""}${q.o?(has?`<button type="button" class="btn pri" onclick="answer(S.ans[S.qs[S.i].id])">Continuer</button>`:""):`<button type="button" class="btn pri" onclick="sendText()">Continuer</button>`}`;
 }else if(S.view==="review"){
  const rows=S.qs.filter(q=>q.id!=="ok"&&S.ans[q.id]!==undefined);
  body=`<p class="mk">Dernière vérification</p><h2 class="mq" id="mq" tabindex="-1">Vérifiez vos informations</h2><p class="muted" style="margin:0 0 14px">Si une information est incorrecte, appuyez sur « Modifier ». Rien n’est envoyé avant votre confirmation.</p>
  <dl class="rv"><dt>Formation</dt><dd><span>${f.n}</span></dd>${rows.map(q=>`<dt>${q.label}</dt><dd><span>${esc(showV(q))}</span><button type="button" class="lk" onclick="editQ('${q.id}')">Modifier</button></dd>`).join("")}</dl>
  <label class="cert"><input type="checkbox" id="certb" ${S.certOK?"checked":""} onchange="S.certOK=this.checked;$('#send').disabled=!this.checked"> Je certifie que ces informations sont exactes.</label>${err}`;
  foot=`<button type="button" class="btn ghost" onclick="backToQ()">Retour</button><button type="button" class="btn pri" id="send" ${S.certOK?"":"disabled"} onclick="submit()">Confirmer ma préinscription</button>`;
 }else if(S.view==="done"){
  const first=esc((S.ans.pre||"").split(" ")[0]);
  body=`<div class="ok" aria-hidden="true">✓</div><h2 class="mq" id="mq" tabindex="-1">Préinscription enregistrée</h2><p>Merci ${first}. Conservez votre numéro de dossier : <strong>${esc(S.ref)}</strong>.</p><p class="muted">L’équipe D-CLIC vous contactera par téléphone ou par email.</p>${CFG.URL?"":'<p class="qi">Mode démonstration : aucune donnée n’a été enregistrée.</p>'}`;
  foot=`<button type="button" class="btn pri" onclick="finish()">Terminer</button>`;
 }else{
  body=`<h2 class="mq" id="mq" tabindex="-1">Nous comprenons</h2><p>Sans votre accord, nous ne pouvons pas enregistrer votre préinscription. Vous pouvez revenir quand vous le souhaitez.</p>`;
  foot=`<button type="button" class="btn ghost" onclick="closeModal()">Fermer</button><button type="button" class="btn pri" onclick="fixOut()">Recommencer</button>`;
 }
 c.innerHTML=head+`<div class="mbd${still?" still":""}">${body}</div><div class="mf">${foot}</div>`;
 const bd=$(".mbd");if(bd&&!still)bd.scrollTop=0;
 const el=$("#in");
 if(el){el.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}});el.focus({preventScroll:true})}
 else if(!still){const h=$("#mq");if(h)h.focus({preventScroll:true})}
}
function pickOpt(ix){
 if(S.lock)return;const q=S.qs[S.i],v=q.o[ix];
 document.querySelectorAll(".mo").forEach((b,j)=>b.classList.toggle("sel",j===ix));
 if(q.notes&&q.notes[v]){S.ans[q.id]=v;S.err="";renderModal();return}   /* message d’information : on attend « Continuer » */
 S.lock=1;setTimeout(()=>{S.lock=0;answer(v)},280);
}
function sendText(){const q=S.qs[S.i],r=check(q,$("#in").value.trim());if(r.e){S.err=r.e;renderModal();return}S.err="";answer(r.val)}
function answer(v){
 const q=S.qs[S.i];pulse();S.ans[q.id]=v;S.err="";
 if(q.id==="ok"&&v==="Non"){S.out="consent";S.view="out";renderModal();return}
 S.qs.forEach(x=>{if(x.if&&!x.if(S.ans))delete S.ans[x.id]});
 if(S.editing){const miss=S.qs.findIndex(x=>x.if&&x.if(S.ans)&&S.ans[x.id]===undefined);if(miss>=0){S.i=miss;renderModal();return}S.editing=false;S.view="review";renderModal();return}
 const ap=applicable(),pos=ap.indexOf(S.i);
 if(pos>=ap.length-1)S.view="review";else S.i=ap[pos+1];
 renderModal();
}
function prevQ(){if(S.editing){S.editing=false;S.view="review";S.err="";renderModal();return}const ap=applicable(),pos=ap.indexOf(S.i);if(pos<=0){closeModal();return}S.err="";S.i=ap[pos-1];renderModal()}
function editQ(id){S.i=S.qs.findIndex(x=>x.id===id);S.editing=true;S.view="q";S.err="";renderModal()}
function backToQ(){const ap=applicable();S.i=ap[ap.length-1];S.editing=false;S.view="q";S.err="";renderModal()}
function fixOut(){delete S.ans.ok;S.i=0;S.out="";S.view="q";S.err="";renderModal()}
async function submit(){
 if(S.sending)return;const b=$("#send");b.disabled=true;b.textContent="Envoi en cours…";S.err="";S.sending=true;const d=payload();
 try{
  if(SENT[d.id])S.ref=SENT[d.id];   /* déjà transmis automatiquement au retour de la connexion */
  else if(CFG.URL){S.ref=await post(d)}
  else{if(CFG.STRICT)throw new Error("config");await new Promise(r=>setTimeout(r,900));S.ref="DCL3-"+Math.floor(1000+Math.random()*9000)}
  setPend(pend().filter(x=>x.id!==d.id));S.view="done";S.sending=false;renderModal();confetti();snd("ok");buzz([30,40,60]);
 }catch(e){S.sending=false;
  if(!CFG.URL&&CFG.STRICT){S.err="L’enregistrement des préinscriptions n’est pas encore activé. Veuillez réessayer ultérieurement.";renderModal();return}
  if(definitif(e)){setPend(pend().filter(x=>x.id!==d.id));
   if(e.code==="closed")S.err="Les préinscriptions sont closes. Merci de l’intérêt que vous portez à D-CLIC.";
   else{const q=S.qs.find(x=>KEYMAP[x.id]===e.champ);S.err="Votre dossier n’a pas pu être validé"+(q?" : vérifiez la rubrique « "+q.label+" » avec le bouton « Modifier »":"")+"."}
   renderModal();return}
  const a=pend().filter(x=>x.id!==d.id);a.push(d);setPend(a);
  S.err="Envoi impossible pour le moment (connexion ?). Vos réponses sont conservées sur cet appareil : appuyez de nouveau sur « Confirmer » lorsque la connexion sera rétablie.";renderModal();
 }
}

LG.pc={t:"Politique de confidentialité",h:()=>`
<p>Cette politique explique quelles données sont collectées par le formulaire de préinscription D-CLIC, pourquoi, et comment vous pouvez exercer vos droits.</p>
<h3>1. Responsable du traitement</h3><p>${todo(ORG.editeur)}</p><p>Contact : ${ORG.contact?esc(ORG.contact):todo("")}</p>
<h3>2. Données collectées</h3>
<p><b>Situation :</b> situation actuelle (sans emploi, reconversion ou étudiant), ville, matériel disponible, fréquence de connexion à internet.</p>
<p><b>Identité et coordonnées :</b> nom, prénoms, sexe, date de naissance, numéro de téléphone principal, autre numéro et adresse email (facultatifs).</p>
<p><b>Projet :</b> formation choisie, deuxième choix, niveau d’études, expérience, motivation, visionnage de la vidéo de présentation.</p>
<p><b>Personne à contacter :</b> nom et numéro de téléphone d’un proche.</p>
<p>Le serveur enregistre aussi la date et l’heure de réception de votre dossier. Aucune adresse IP n’est conservée avec votre dossier.</p>
<h3>3. Pourquoi ces données sont utilisées</h3>
<p>Elles servent à examiner votre candidature, à vous contacter par téléphone ou par email, à gérer les places et les deuxièmes choix, et à produire des statistiques sur les candidatures. Elles reposent sur votre consentement, donné avant le formulaire. Aucune décision automatisée n’est prise à partir de vos réponses.</p>
<h3>4. Qui y a accès</h3>
<p>L’équipe en charge de D-CLIC au Congo et les organisations partenaires du programme, dans la limite de leur mission. Vos données ne sont ni vendues, ni cédées à des fins commerciales, ni utilisées pour de la publicité.</p>
<h3>5. Stockage et sécurité</h3>
<p>Vos réponses sont enregistrées dans un tableur en ligne à accès restreint, hébergé par Google, dont les serveurs peuvent se situer hors du Congo. Les mesures suivantes s’appliquent : accès limité aux personnes habilitées, contrôle systématique des informations reçues, limitation des envois abusifs, sauvegardes régulières et transmission chiffrée entre votre appareil et le serveur.</p>
<h3>6. Durée de conservation</h3><p>${todo(ORG.conservation)}.</p>
<h3>7. Vos droits</h3>
<p>Conformément à la législation applicable en République du Congo en matière de protection des données à caractère personnel, vous pouvez demander l’accès à vos données, leur rectification, leur suppression, vous opposer à leur traitement et retirer votre consentement à tout moment. Pour cela, écrivez à ${ORG.contact?esc(ORG.contact):todo("")} en indiquant votre numéro de dossier ; une pièce justifiant votre identité pourra vous être demandée. Vous pouvez aussi saisir l’autorité congolaise compétente en matière de protection des données.</p>
<h3>8. Proche à contacter</h3><p>En indiquant les coordonnées d’un proche, vous déclarez l’en avoir informé. Elles servent uniquement à vous joindre si l’équipe n’y parvient pas directement.</p>
<h3>9. Sur votre appareil et services tiers</h3>
<p>Si l’envoi échoue (connexion coupée), vos réponses sont conservées temporairement sur votre appareil afin d’être renvoyées, puis supprimées après l’envoi. Sur un appareil partagé, pensez à effacer les données du site. Le site n’utilise ni cookie publicitaire ni outil de mesure d’audience. Les polices de caractères sont chargées depuis Google Fonts, ce qui transmet votre adresse IP à ce service.</p>
