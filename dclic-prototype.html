<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D-CLIC Congo, préinscription cohorte 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F8F4;
      --surface: #fff;
      --text: #123C3B;
      --muted: #587270;
      --line: #D5E0DB;
      --btn: #123C3B;
      --btnfg: #fff;
      --red: #D81E35;
      --blue: #1688BD;
      --green: #5E9120;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0B1F1E;
        --surface: #12302E;
        --text: #EAF3EF;
        --muted: #9DB8B3;
        --line: #27514E;
        --btn: #FFD612;
        --btnfg: #123C3B
      }
    }

    :root[data-theme="dark"] {
      --bg: #0B1F1E;
      --surface: #12302E;
      --text: #EAF3EF;
      --muted: #9DB8B3;
      --line: #27514E;
      --btn: #FFD612;
      --btnfg: #123C3B
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.6 Poppins, system-ui, -apple-system, "Segoe UI", sans-serif
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px
    }

    header {
      padding: 18px 0 14px
    }

    .logos {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border-radius: 16px;
      padding: 10px 16px;
      width: fit-content
    }

    .logos img {
      height: 46px;
      width: auto;
      display: block
    }

    .logos i {
      width: 1px;
      height: 34px;
      background: #cfd8d4
    }

    .flag {
      height: 5px;
      background: linear-gradient(90deg, #009A44 33.3%, #FBDE4A 33.3% 66.6%, #DC241F 66.6%)
    }

    .step {
      font-size: 13px;
      color: var(--muted);
      margin: 18px 0 0
    }

    h1 {
      font-weight: 700;
      font-size: clamp(30px, 7.4vw, 50px);
      line-height: 1.1;
      letter-spacing: -.02em;
      margin: .35em 0 .45em
    }

    h2 {
      font-weight: 700;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.2;
      margin: .4em 0 .5em
    }

    p {
      margin: 0 0 1em;
      max-width: 62ch
    }

    .muted {
      color: var(--muted)
    }

    .fl {
      display: grid;
      gap: 10px;
      margin: 22px 0 28px
    }

    .fb {
      background: var(--c);
      color: #fff;
      border-radius: 18px;
      padding: 16px 20px;
      font-weight: 600;
      font-size: 18px
    }

    .fb small {
      display: block;
      font-weight: 400;
      font-size: 14px;
      opacity: .92
    }

    .btn {
      font: 600 16px Poppins, system-ui, sans-serif;
      background: var(--btn);
      color: var(--btnfg);
      border: 0;
      border-radius: 14px;
      padding: 14px 24px;
      cursor: pointer
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--line)
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #29ABE2;
      outline-offset: 2px
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0 14px
    }

    .tab {
      font: 600 14px Poppins, system-ui, sans-serif;
      border: 2px solid var(--c);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer
    }

    .tab[aria-selected="true"] {
      background: var(--c);
      color: #fff
    }

    .stage {
      background: var(--c);
      color: #fff;
      border-radius: 22px;
      min-height: 270px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px
    }

    .kw {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 700;
      line-height: 1.15;
      animation: pop .5s cubic-bezier(.2, .9, .3, 1.2)
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .sub {
      font-size: 15px;
      background: rgba(0, 0, 0, .3);
      padding: 10px 14px;
      border-radius: 12px
    }

    .dots {
      display: flex;
      gap: 6px
    }

    .dots span {
      height: 4px;
      flex: 1;
      background: rgba(255, 255, 255, .35);
      border-radius: 2px
    }

    .dots .on {
      background: #fff
    }

    .bars {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 28px
    }

    .bars b {
      width: 5px;
      height: 6px;
      background: #fff;
      border-radius: 3px
    }

    .talk .bars b {
      animation: wave .8s ease-in-out infinite
    }

    .talk .bars b:nth-child(2) {
      animation-delay: .15s
    }

    .talk .bars b:nth-child(3) {
      animation-delay: .3s
    }

    .talk .bars b:nth-child(4) {
      animation-delay: .45s
    }

    .talk .bars b:nth-child(5) {
      animation-delay: .6s
    }

    @keyframes wave {
      50% {
        height: 26px
      }
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 14px 0
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      border: 2px solid var(--c);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 14px
    }

    .cards {
      display: grid;
      gap: 12px;
      margin: 20px 0
    }

    .card {
      all: unset;
      box-sizing: border-box;
      display: block;
      background: var(--c);
      color: #fff;
      border-radius: 20px;
      padding: 20px 22px;
      cursor: pointer;
      font-weight: 600;
      font-size: 20px
    }

    .card small {
      display: block;
      font-weight: 400;
      font-size: 14px;
      margin-top: 4px
    }

    .card:hover {
      transform: translateY(-2px)
    }

    .card:focus-visible {
      outline: 3px solid #29ABE2;
      outline-offset: 3px
    }

    .prog {
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0 4px
    }

    .prog div {
      height: 100%;
      background: var(--c);
      transition: width .4s
    }

    .bub {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 10px 0
    }

    .bot {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top-left-radius: 4px
    }

    .me {
      background: var(--c);
      color: #fff;
      margin-left: auto;
      border-top-right-radius: 4px
    }

    .new {
      animation: pop .35s ease-out
    }

    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--muted);
      animation: wave2 1s infinite
    }

    .typing span:nth-child(2) {
      animation-delay: .15s
    }

    .typing span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes wave2 {
      50% {
        transform: translateY(-5px)
      }
    }

    .opts {
      display: grid;
      gap: 8px;
      margin: 14px 0
    }

    .opt {
      font: 500 16px Poppins, system-ui, sans-serif;
      text-align: left;
      border: 2px solid var(--c);
      background: var(--surface);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer
    }

    .opt:hover {
      background: var(--c);
      color: #fff
    }

    input,
    textarea {
      font: inherit;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--surface);
      color: var(--text)
    }

    input:focus,
    textarea:focus {
      border-color: var(--c)
    }

    .err {
      color: #D81E35;
      font-size: 14px;
      margin: 6px 0 0
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .err {
        color: #FF8A98
      }
    }

    .ok {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #5E9120;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 38px;
      animation: pop .5s
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin: 16px 0
    }

    dt {
      color: var(--muted)
    }

    dd {
      margin: 0;
      font-weight: 500;
      overflow-wrap: anywhere
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding: 16px 0 28px;
      margin-top: 36px
    }

    .film {
      position: relative;
      width: min(100%, 380px);
      aspect-ratio: 9/16;
      margin: 0 auto;
      background: #F7FAF8;
      color: #123C3B;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 44px 18px 78px;
      text-align: center;
      cursor: pointer
    }

    .film h3 {
      font-size: clamp(20px, 6vw, 26px);
      line-height: 1.2;
      margin: 0;
      font-weight: 700;
      animation: pop .5s both
    }

    .film em {
      font-style: normal;
      color: var(--c)
    }

    .tg {
      font: 500 11px/1 ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--c);
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center
    }

    .tg b {
      background: var(--c);
      color: #fff;
      padding: 3px 5px;
      border-radius: 4px
    }

    .fd {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 4px
    }

    .fd span {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: #123C3B22
    }

    .fd .on {
      background: var(--c)
    }

    .fs {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 14px;
      background: rgba(18, 60, 59, .93);
      color: #fff;
      font-size: 12.5px;
      line-height: 1.4;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: left
    }

    .film .logo {
      width: 62%;
      animation: pop .7s both
    }

    .poster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .poster p {
      margin: 0;
      font-size: 13px;
      color: #587270
    }

    .pp {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      padding-left: 4px
    }

    .m {
      width: 100%;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(18, 60, 59, .14);
      text-align: left;
      font-size: 12px
    }

    .r {
      opacity: 0;
      transform: translateY(12px);
      animation: rv .5s ease-out forwards var(--dl, 0s)
    }

    @keyframes rv {
      to {
        opacity: 1;
        transform: none
      }
    }

    .ty {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: bottom;
      width: 0;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      animation: ty var(--d, 1.2s) steps(var(--n)) forwards var(--dl, 0s)
    }

    @keyframes ty {
      to {
        width: calc(var(--n)*1ch)
      }
    }

    .srch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 999px;
      color: #587270
    }

    .res {
      padding: 12px 14px;
      margin-top: 10px;
      border: 2px solid var(--c)
    }

    .res small {
      display: block;
      color: #587270;
      font-size: 10px
    }

    .sk {
      height: 8px;
      border-radius: 4px;
      background: #E3EBE7;
      margin-top: 6px
    }

    .post .ph {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px
    }

    .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--c)
    }

    .post small {
      display: block;
      color: #587270;
      font-size: 10px
    }

    .pi {
      margin: 0 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--c), #123C3B);
      color: #fff;
      font-weight: 700;
      font-size: 19px;
      line-height: 1.2;
      padding: 34px 18px;
      text-align: center
    }

    .pf {
      display: flex;
      gap: 12px;
      padding: 10px;
      font-size: 10.5px;
      color: #587270
    }

    .chart {
      padding: 12px 0
    }

    .chart small,
    .chart strong {
      display: block;
      padding: 0 14px
    }

    .chart strong {
      color: var(--c);
      font-size: 15px;
      margin-top: 8px
    }

    .bs {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 110px;
      padding: 8px 14px 0
    }

    .bs i {
      flex: 1;
      height: 0;
      background: var(--c);
      border-radius: 5px 5px 0 0;
      animation: gr .7s ease-out forwards var(--dl)
    }

    @keyframes gr {
      to {
        height: var(--h)
      }
    }

    .bt {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 8px 10px;
      background: #E8EFEB;
      border-radius: 14px 14px 0 0
    }

    .bt>span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B9C8C2
    }

    .bt em {
      margin-left: 6px;
      flex: 1;
      background: #fff;
      border-radius: 6px;
      padding: 2px 8px;
      font-style: normal;
      font-size: 10px;
      color: #587270
    }

    .bb {
      padding: 12px;
      display: grid;
      gap: 8px
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px
    }

    .hero>div:first-child {
      display: grid;
      gap: 2px;
      align-content: start
    }

    .hb {
      border-radius: 10px;
      background: linear-gradient(135deg, var(--c), #123C3B);
      min-height: 70px
    }

    .bt2 {
      height: 14px;
      width: 45%;
      background: var(--c)
    }

    .cards3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .cards3 span {
      height: 30px;
      border-radius: 8px;
      background: #EEF3F0
    }

    .pill {
      display: inline-block;
      background: #5E9120;
      color: #fff;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px
    }

    .code {
      background: #102427;
      color: #CFE8E0;
      overflow: hidden
    }

    .code .bt {
      background: #183338;
      border-radius: 0
    }

    .code .bt em {
      background: transparent;
      color: #9DB8B3
    }

    .code pre {
      margin: 0;
      padding: 12px 14px;
      font: 11.5px/1.8 ui-monospace, Menlo, Consolas, monospace
    }

    .cm {
      color: #6F8C89
    }

    .phn {
      width: 60%;
      border: 6px solid #123C3B;
      border-radius: 28px;
      background: #F1F5F3;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(18, 60, 59, .25);
      text-align: left
    }

    .ah {
      background: #123C3B;
      color: #fff;
      padding: 20px 12px 10px;
      font-weight: 600;
      font-size: 13px
    }

    .scr {
      position: relative;
      min-height: 230px;
      padding-top: 2px
    }

    .rw {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #fff;
      margin: 7px;
      border-radius: 10px;
      padding: 8px;
      font-size: 11px
    }

    .rw i {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--c) 18%, #fff);
      color: var(--c);
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 700
    }

    .rw b {
      display: block;
      font-size: 11.5px
    }

    .rw small {
      color: #587270;
      font-size: 9.5px
    }

    .rw s {
      margin-left: auto;
      text-decoration: none;
      font-size: 9px;
      border-radius: 999px;
      padding: 2px 7px;
      background: #E1F0D5;
      color: #3E6B14
    }

    .ts {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
      padding: 8px 10px;
      font-size: 11px
    }

    .ts small {
      display: block;
      color: #587270;
      font-size: 9.5px
    }

    .jc {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center
    }

    .jc span {
      border: 2px solid var(--c);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 13px;
      font-weight: 600;
      background: #fff
    }

    .cta {
      display: inline-block;
      background: var(--c);
      color: #fff;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 600;
      font-size: 14px;
      opacity: 0;
      animation: rv .5s ease-out .8s forwards, pl 1.6s ease-in-out 1.6s infinite
    }

    @keyframes pl {
      50% {
        box-shadow: 0 0 0 10px #ffffff00, 0 6px 20px rgba(0, 0, 0, .25)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      .r,
      .cta {
        opacity: 1 !important;
        transform: none !important
      }

      .ty {
        width: auto !important
      }

      .bs i {
        height: var(--h) !important
      }
    }

    .chk {
      padding: 14px;
      display: grid;
      gap: 12px
    }

    .ck {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 500
    }

    .ck i {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 13px
    }

    .fs {
      font-size: 13px !important
    }

    :root:root:root {
      --bg: #0A2221;
      --surface: #123533;
      --text: #F1F7F4;
      --muted: #A9C2BD;
      --line: #2A5551;
      --btn: #FFD612;
      --btnfg: #123C3B
    }

    body {
      min-height: 100vh;
      overflow-x: hidden
    }

    .wrap {
      max-width: 1000px
    }

    #world {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none
    }

    #world::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--w, #29ABE2) 48%, transparent), transparent 62%)
    }

    #world i {
      position: absolute;
      width: 11px;
      border-radius: 6px;
      animation: fl ease-in-out infinite alternate
    }

    @keyframes fl {
      to {
        transform: translateY(-70px)
      }
    }

    header,
    main,
    .note,
    .flag {
      position: relative;
      z-index: 2
    }

    #wipe {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--wc, #123C3B);
      pointer-events: none;
      clip-path: circle(0% at 50% 62%)
    }

    .hero {
      min-height: 56vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 10px
    }

    .hero h1 {
      font-size: clamp(34px, 7vw, 60px);
      max-width: 13ch
    }

    .orbs {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 24px 0
    }

    .orb {
      all: unset;
      flex: none;
      box-sizing: border-box;
      cursor: pointer;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      color: #fff;
      font: 600 13px/1.25 Poppins, system-ui, sans-serif;
      padding: 12px;
      background: radial-gradient(circle at 30% 26%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 62%);
      box-shadow: 0 0 44px color-mix(in srgb, var(--c) 65%, transparent);
      animation: bob 5s ease-in-out infinite;
      animation-delay: var(--dl, 0s)
    }

    @keyframes bob {
      50% {
        transform: translateY(-12px)
      }
    }

    .orb:hover {
      filter: brightness(1.12)
    }

    .orb:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px
    }

    .orbs.sm {
      gap: 12px;
      margin: 0 0 18px
    }

    .orbs.sm .orb {
      width: 76px;
      height: 76px;
      font-size: 10px;
      padding: 6px;
      animation: none
    }

    .orb[aria-current="true"] {
      outline: 3px solid #fff;
      outline-offset: 3px
    }

    .dw {
      display: grid;
      gap: 28px;
      align-items: center;
      padding: 14px 0 30px
    }

    @media (min-width:820px) {
      .dw {
        grid-template-columns: auto 1fr;
        gap: 56px
      }
    }

    .phone {
      position: relative;
      width: min(300px, 76vw);
      aspect-ratio: 9/16;
      border-radius: 30px;
      overflow: hidden;
      margin: 0 auto;
      background: #F7FAF8;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 65%, #fff), 0 0 90px color-mix(in srgb, var(--c) 70%, transparent)
    }

    .phone video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .big {
      all: unset;
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: rgba(10, 34, 33, .4);
      color: #fff;
      font-size: 46px
    }

    .side h2 {
      font-size: clamp(28px, 5vw, 44px);
      margin: .1em 0
    }

    .pulse {
      animation: pls 1.3s ease-in-out infinite
    }

    @keyframes pls {
      50% {
        transform: scale(1.06)
      }
    }

    .cf {
      position: fixed;
      top: -16px;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      z-index: 60;
      pointer-events: none;
      animation: cfall linear forwards
    }

    @keyframes cfall {
      to {
        transform: translateY(110vh) rotate(720deg)
      }
    }

    header .wrap {
      position: relative
    }

    .sndb {
      position: static;
      font: 500 12px Poppins, system-ui, sans-serif;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer
    }

    .sndb:hover {
      color: var(--text)
    }

    #spot {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 40%), color-mix(in srgb, var(--w, #29ABE2) 24%, transparent), transparent 70%);
      transition: opacity .6s
    }

    body.cine #spot {
      opacity: .25
    }

    body.cine #world i {
      opacity: .05 !important;
      transition: opacity .8s
    }

    #world.alive i {
      animation-duration: 2.4s !important
    }

    #world.pw::before {
      animation: pw .8s ease-out
    }

    @keyframes pw {
      35% {
        transform: scale(1.35);
        filter: brightness(1.6)
      }
    }

    .ent {
      opacity: 0;
      animation: entIn .65s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: var(--ed, 0s)
    }

    @keyframes entIn {
      from {
        opacity: 0;
        transform: translateY(22px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .pt {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 70;
      animation: pt .7s ease-out forwards
    }

    @keyframes pt {
      from {
        transform: translate(-50%, -50%);
        opacity: 1
      }

      to {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2);
        opacity: 0
      }
    }

    .phone {
      transition: transform .25s ease-out, box-shadow .6s;
      will-change: transform
    }

    body.cine .phone {
      animation: breathe 3.2s ease-in-out infinite
    }

    @keyframes breathe {
      50% {
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 65%, #fff), 0 0 140px color-mix(in srgb, var(--c) 85%, transparent)
      }
    }

    .ld {
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
      background: rgba(10, 34, 33, .45)
    }

    .ld::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      margin: -21px;
      border: 4px solid #ffffff55;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .orb {
      transition: box-shadow .3s, filter .3s
    }

    .orb:hover {
      box-shadow: 0 0 80px color-mix(in srgb, var(--c) 90%, transparent)
    }

    @media (prefers-reduced-motion:reduce) {
      .ent {
        opacity: 1 !important;
        transform: none !important
      }

      .phone {
        transform: none !important
      }
    }

    .pk {
      display: grid;
      gap: 16px;
      margin: 26px 0;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))
    }

    .pc {
      all: unset;
      box-sizing: border-box;
      cursor: pointer;
      display: grid;
      gap: 8px;
      padding: 22px;
      border-radius: 22px;
      background: var(--surface);
      border: 2px solid var(--c);
      color: var(--text);
      box-shadow: 0 0 40px color-mix(in srgb, var(--c) 35%, transparent);
      transition: translate .25s, box-shadow .25s
    }

    .pc::before {
      content: "";
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 26%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 62%)
    }

    .pc b {
      font-size: 22px;
      line-height: 1.2
    }

    .pc span {
      color: var(--muted)
    }

    .pc em {
      font-style: normal;
      font-weight: 600;
      margin-top: 6px
    }

    .pc:hover {
      translate: 0 -5px;
      box-shadow: 0 0 70px color-mix(in srgb, var(--c) 60%, transparent)
    }

    .pc:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px
    }

    .lab {
      font-weight: 600;
      margin: 18px 0 8px
    }

    .jl {
      display: grid;
      gap: 10px;
      margin-bottom: 16px
    }

    .job {
      border-left: 4px solid var(--c);
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 14px
    }

    .job b {
      display: block;
      font-size: 15px
    }

    .job span {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.45
    }

    .bub.hdr {
      background: transparent;
      border: 0;
      color: var(--muted);
      font: 500 12px ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 10px 0 0;
      max-width: 100%
    }

    input[type=date] {
      color-scheme: dark
    }

    .rv dd {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .rv dd span {
      overflow-wrap: anywhere
    }

    .lk {
      all: unset;
      cursor: pointer;
      color: #FFD612;
      font-size: 13px;
      text-decoration: underline;
      white-space: nowrap
    }

    .lk:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px
    }

    .cert {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 16px 0
    }

    .cert input {
      width: 20px;
      height: 20px;
      flex: none
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    @media (max-width:560px) {
      .rv {
        grid-template-columns: 1fr;
        gap: 2px
      }

      .rv dt {
        font-size: 12px;
        margin-top: 10px
      }

      .rv dt:first-child {
        margin-top: 0
      }
    }

    .ic {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center
    }

    .ic svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .wl {
      display: grid;
      gap: 12px;
      margin: 24px 0;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr))
    }

    .wt {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .wt b {
      display: block;
      font-size: 15px;
      line-height: 1.25
    }

    .wt div span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 2px
    }

    .pc::before {
      display: none
    }

    .pc {
      gap: 10px;
      border: 1px solid var(--line);
      box-shadow: none;
      position: relative;
      overflow: hidden;
      padding: 22px
    }

    .pc::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: var(--c)
    }

    .pc .ic {
      color: #fff;
      margin-bottom: 4px
    }

    .pc .tg2 {
      color: var(--muted)
    }

    .pc:hover {
      border-color: var(--c);
      box-shadow: 0 12px 40px color-mix(in srgb, var(--c) 40%, transparent)
    }

    .seg {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 20px
    }

    .seg button {
      all: unset;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 16px 6px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--text);
      font: 500 14px Poppins, system-ui, sans-serif;
      transition: background .25s, border-color .25s
    }

    .seg .ic {
      width: 30px;
      height: 30px;
      border-radius: 50%
    }

    .seg .ic svg {
      width: 16px;
      height: 16px
    }

    .seg button:hover {
      border-color: var(--c)
    }

    .seg button[aria-selected="true"] {
      background: var(--c);
      border-color: var(--c);
      color: #fff
    }

    .seg button[aria-selected="true"] .ic {
      background: #ffffff33
    }

    .seg button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px
    }

    .lab {
      font: 500 12px ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 22px 0 10px
    }

    .jl {
      gap: 0;
      border-bottom: 1px solid var(--line)
    }

    .job {
      display: flex;
      gap: 18px;
      align-items: baseline;
      border-left: 0;
      background: none;
      border-radius: 0;
      border-top: 1px solid var(--line);
      padding: 16px 6px;
      transition: padding .3s, background .3s
    }

    .job i {
      flex: none;
      width: 26px;
      font: 500 13px ui-monospace, Menlo, Consolas, monospace;
      font-style: normal;
      color: color-mix(in srgb, var(--c) 55%, #fff)
    }

    .job>div {
      flex: 1
    }

    .job b {
      font-size: 17px;
      margin-bottom: 3px
    }

    .job span {
      font-size: 14px
    }

    .job:hover {
      padding-left: 14px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent), transparent 85%)
    }

    header .wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px
    }

    .step {
      flex-basis: 100%;
      margin: 0
    }

    .phone {
      width: min(300px, 76vw, calc(68vh*9/16));
      width: min(300px, 76vw, calc(68dvh*9/16))
    }

    .md {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 16, 15, .74);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: mdIn .25s ease-out
    }

    @keyframes mdIn {
      from {
        opacity: 0
      }
    }

    .mdc {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(600px, 100%);
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
      overflow: hidden;
      animation: mcIn .4s cubic-bezier(.22, 1, .36, 1)
    }

    @keyframes mcIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.97)
      }
    }

    .mh {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 14px 18px;
      border-bottom: 1px solid var(--line)
    }

    .mh .ic {
      width: 40px;
      height: 40px;
      border-radius: 12px
    }

    .mt {
      flex: 1;
      min-width: 0;
      line-height: 1.25
    }

    .mt small {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .mt b {
      display: block;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .mx {
      all: unset;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: none
    }

    .mx:hover {
      background: var(--line);
      color: var(--text)
    }

    .mx:focus-visible {
      outline: 3px solid #fff
    }

    .mbd {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 22px 22px;
      animation: qin .45s cubic-bezier(.22, 1, .36, 1)
    }

    @keyframes qin {
      from {
        opacity: 0;
        transform: translateX(26px)
      }
    }

    .pb {
      height: 5px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden;
      margin-bottom: 18px
    }

    .pb div {
      height: 100%;
      background: var(--c);
      border-radius: 3px;
      transition: width .5s
    }

    .mk {
      margin: 0 0 6px;
      font: 500 12px ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .mq {
      font-size: clamp(20px, 4.6vw, 26px);
      line-height: 1.3;
      margin: 0 0 18px;
      font-weight: 600
    }

    .mos {
      display: grid;
      gap: 10px
    }

    .mo {
      all: unset;
      box-sizing: border-box;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      color: var(--text);
      font: 500 16px/1.35 Poppins, system-ui, sans-serif;
      transition: border-color .2s, background .2s
    }

    .mo i {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      position: relative;
      transition: border-color .2s
    }

    .mo:hover {
      border-color: var(--c)
    }

    .mo.sel {
      border-color: var(--c);
      background: color-mix(in srgb, var(--c) 16%, transparent)
    }

    .mo.sel i {
      border-color: var(--c)
    }

    .mo.sel i::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--c)
    }

    .mo:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px
    }

    .mbd input,
    .mbd textarea {
      font-size: 16px;
      padding: 15px 16px;
      border-radius: 14px
    }

    .mbd .ok {
      margin: 6px 0 16px
    }

    .mf {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      padding: 14px 22px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line)
    }

    .mf .btn {
      flex: 0 1 auto
    }

    .mf .btn.pri {
      background: var(--c);
      color: #fff
    }

    .cf {
      z-index: 120
    }

    @media (max-width:600px) {
      .md {
        padding: 0
      }

      .mdc {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        border: 0
      }

      .mbd {
        padding: 16px 18px 20px
      }

      .mf {
        padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px))
      }

      .mf .btn {
        flex: 1 1 auto;
        padding: 14px 16px
      }
    }

    @media (max-width:380px) {
      .logos img {
        height: 38px
      }

      .wl {
        grid-template-columns: 1fr
      }
    }

    @media (max-height:520px) and (orientation:landscape) {
      .hero {
        min-height: 0
      }

      .phone {
        width: min(220px, 40vw)
      }
    }

    .mq.sm {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5
    }

    .logos {
      order: 0
    }

    .sndb {
      order: 1;
      margin-left: auto
    }

    .step {
      order: 2
    }

    @media (max-width:600px) {
      .side .row .btn {
        flex: 1 1 100%
      }
    }
  </style>
</head>

<body>
  <div id="world"></div>
  <div id="wipe"></div>
  <header>

      if (e.key === "ArrowRight") go("discover", KEYS[(i + 1) % KEYS.length]); else if (e.key === "ArrowLeft") go("discover", KEYS[(i + KEYS.length - 1) % KEYS.length]);
      else if (e.key === " ") {e.preventDefault(); const v = $("#vid"); if (v) v.paused ? v.play().catch(() => { }) : v.pause()}
    });
    function pulse() {const w = $("#world"); w.classList.remove("pw"); void w.offsetWidth; w.classList.add("pw")}
    const _answer = answer; answer = function (v, s) {pulse(); return _answer(v, s)};
    const _go = go; go = function (s, k) {snd("whoosh"); return _go(s, k)};
    const _bind = bindVid; bindVid = function (k) {
      _bind(k); const v = $("#vid"), ph = $(".phone"); ph.insertAdjacentHTML("beforeend", '<div class="ld"></div>'); const ld = ph.querySelector(".ld"), on = () => {ld.style.display = "block"}, off = () => {ld.style.display = "none"};
      v.addEventListener("waiting", on); v.addEventListener("loadstart", on);["canplay", "playing"].forEach(t => v.addEventListener(t, off));
      v.addEventListener("play", () => document.body.classList.add("cine")); S.watched = S.watched || {}; v.addEventListener("timeupdate", () => {if (v.duration && v.currentTime / v.duration > .9) S.watched[k] = 1});["pause", "ended"].forEach(t => v.addEventListener(t, () => document.body.classList.remove("cine")))
    };
    function enhance() {
      if (S.screen === "form") return;
      [...app.querySelectorAll("h1,h2,p,.wt,.pc,.seg,.lab,.job,.row,dl,.ok")].forEach((el, i) => {el.classList.add("ent"); el.style.setProperty("--ed", (i * .09) + "s")});
      if (S.screen === "discover" && !$(".kb")) $(".side").insertAdjacentHTML("beforeend", '<p class="muted kb" style="font-size:12px">Astuce : touches ← → pour changer de formation, espace pour lecture ou pause.</p>')
    }
    const _render = render; render = function () {document.body.classList.remove("cine"); _render(); enhance(); if (S.screen === "done") {snd("ok"); buzz([30, 40, 60])} };
    render();
  </script>
